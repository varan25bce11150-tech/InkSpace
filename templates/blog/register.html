
{% extends "blog/base.html" %}

{% block title %}Create Account | InkSpace{% endblock %}

{% block content %}

<section class="auth-card">
    <h1>Create your account</h1>
    <p>Join InkSpace and start sharing your ideas.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-primary">
            Create Account
        </button>
    </form>

    <p class="auth-footer">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
</section>

{% endblock %}
